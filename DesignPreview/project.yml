name: CoconutDesignPreview
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  WallpaperLab:
    path: ..
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  CoconutDesignPreview:
    type: application
    platform: iOS
    sources:
      - path: ../App
        excludes: [BundledCatalog, Info.plist, "*private*"]
      - path: ../App/BundledCatalog
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardobaptiste.coconut.design
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ../App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Coconut Design
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1'
    dependencies:
      - package: WallpaperLab
        product: WallpaperPackageManager
      - package: WallpaperLab
        product: WallpaperInstaller
      - package: WallpaperLab
        product: CompatibilityManager
  CoconutExperienceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [../Tests/CoconutExperienceTests]
    dependencies:
      - target: CoconutDesignPreview
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardobaptiste.coconut.design.tests
  CoconutDesignUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [../Tests/CoconutGalleryUITests]
    dependencies:
      - target: CoconutDesignPreview
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardobaptiste.coconut.design.uitests
schemes:
  CoconutDesignPreview:
    build:
      targets:
        CoconutDesignPreview: all
    test:
      targets: [CoconutExperienceTests, CoconutDesignUITests]
